<!-- BRIEF: quadro Ethernet campo a campo, tira horizontal com os campos coloridos e tamanho em bytes: Preambulo 7 | SFD 1 | MAC dest 6 | MAC orig 6 | EtherType 2 | Payload 46-1500 | FCS 4. Destaque nos MACs e no FCS. Estetica hand-drawn/Excalidraw, halo off-white, fundo transparente, paleta Uniube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Quadro Ethernet dividido em campos: preambulo 7 bytes, SFD 1, MAC destino 6, MAC origem 6, EtherType 2, payload 46 a 1500 e FCS 4 bytes">
  <defs>
    <style>
      .sk  { stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
  </defs>

  <!-- TITULO -->
  <text x="450" y="40" text-anchor="middle" class="lbl" font-size="24" font-weight="bold" fill="#1d2057">O quadro Ethernet, campo a campo</text>
  <path class="sk" d="M300,52 q75,7 150,3 q75,-4 150,2" stroke="#00aa9f" stroke-width="2.5"/>

  <!-- TIRA DE CAMPOS (y=120, altura 80) -->
  <!-- Preambulo -->
  <g>
    <rect x="40" y="120" width="92" height="80" rx="8" class="sk" fill="#eef1f7" stroke="#9aa4bd" stroke-width="2.5"/>
    <text x="86" y="156" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">Preâmbulo</text>
    <text x="86" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#6a7390">7 bytes</text>
  </g>
  <!-- SFD -->
  <g>
    <rect x="134" y="120" width="52" height="80" rx="8" class="sk" fill="#eef1f7" stroke="#9aa4bd" stroke-width="2.5"/>
    <text x="160" y="156" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">SFD</text>
    <text x="160" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#6a7390">1</text>
  </g>
  <!-- MAC destino (destaque) -->
  <g>
    <rect x="188" y="120" width="104" height="80" rx="8" class="sk" fill="#e4f0fb" stroke="#2778c4" stroke-width="3.5"/>
    <text x="240" y="150" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2778c4">MAC</text>
    <text x="240" y="168" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2778c4">destino</text>
    <text x="240" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2778c4">6 bytes</text>
  </g>
  <!-- MAC origem (destaque) -->
  <g>
    <rect x="294" y="120" width="104" height="80" rx="8" class="sk" fill="#e4f0fb" stroke="#2778c4" stroke-width="3.5"/>
    <text x="346" y="150" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2778c4">MAC</text>
    <text x="346" y="168" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2778c4">origem</text>
    <text x="346" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2778c4">6 bytes</text>
  </g>
  <!-- EtherType -->
  <g>
    <rect x="400" y="120" width="78" height="80" rx="8" class="sk" fill="#fbeee6" stroke="#b1541b" stroke-width="2.5"/>
    <text x="439" y="150" text-anchor="middle" class="lbl" font-size="13" fill="#b1541b">Ether</text>
    <text x="439" y="168" text-anchor="middle" class="lbl" font-size="13" fill="#b1541b">Type</text>
    <text x="439" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#b1541b">2</text>
  </g>
  <!-- Payload -->
  <g>
    <rect x="480" y="120" width="250" height="80" rx="8" class="sk" fill="#eaf5ee" stroke="#2e7d52" stroke-width="3"/>
    <text x="605" y="150" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2e7d52">Dados (Payload)</text>
    <text x="605" y="172" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">o pacote IP vai aqui dentro</text>
    <text x="605" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2e7d52">46 a 1500 bytes</text>
  </g>
  <!-- FCS (destaque) -->
  <g>
    <rect x="732" y="120" width="128" height="80" rx="8" class="sk" fill="#f3eafa" stroke="#7a4fb0" stroke-width="3.5"/>
    <text x="796" y="150" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#7a4fb0">FCS</text>
    <text x="796" y="168" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">CRC-32</text>
    <text x="796" y="236" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#7a4fb0">4 bytes</text>
  </g>

  <!-- LEGENDAS EXPLICATIVAS -->
  <g>
    <path class="sk" d="M240,120 q0,-26 0,-30" stroke="#2778c4" stroke-width="2"/>
    <text x="240" y="80" text-anchor="middle" class="lbl" font-size="12" fill="#2778c4">quem recebe / quem envia</text>
    <path class="sk" d="M796,210 q0,24 0,30" stroke="#7a4fb0" stroke-width="2"/>
    <text x="796" y="270" text-anchor="middle" class="lbl" font-size="12" fill="#7a4fb0">confere se chegou íntegro</text>
  </g>

  <!-- RODAPE -->
  <text x="450" y="322" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">O payload máximo de 1500 bytes é o que define o MTU padrão da Ethernet</text>
</svg>
