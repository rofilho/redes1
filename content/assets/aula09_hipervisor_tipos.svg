<!-- BRIEF: hipervisor tipo 1 vs tipo 2, duas pilhas lado a lado. Tipo 1 (esq): hardware -> hipervisor -> [VM1 VM2 VM3 + particao de gerencia]. Tipo 2 (dir): hardware -> SO hospedeiro -> programa de virtualizacao -> [VM1 VM2]. Legenda: tipo 1 = menos camadas (servidor); tipo 2 = mais camadas (estudo). Hand-drawn, halo off-white, fundo transparente, paleta Uniube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Duas pilhas lado a lado: no tipo 1 o hipervisor fica logo acima do hardware; no tipo 2 há um sistema operacional inteiro entre o hipervisor e o hardware">
  <defs>
    <style>
      .sk  { stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
  </defs>

  <!-- TITULO -->
  <text x="450" y="40" text-anchor="middle" class="lbl" font-size="24" font-weight="bold" fill="#1d2057">Tipo 1 x tipo 2: onde o hipervisor fica</text>
  <path class="sk" d="M290,52 q80,7 160,3 q80,-4 160,2" stroke="#00aa9f" stroke-width="2.5"/>

  <!-- ============ PILHA TIPO 1 (esquerda) ============ -->
  <g>
    <text x="225" y="84" text-anchor="middle" class="lbl" font-size="17" font-weight="bold" fill="#2e7d52">TIPO 1 · bare-metal</text>

    <!-- VMs + gerencia (topo) -->
    <rect x="80" y="104" width="60" height="52" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2.5"/>
    <text x="110" y="136" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VM 1</text>
    <rect x="150" y="104" width="60" height="52" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2.5"/>
    <text x="180" y="136" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VM 2</text>
    <rect x="220" y="104" width="60" height="52" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2.5"/>
    <text x="250" y="136" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VM 3</text>
    <rect x="290" y="104" width="80" height="52" rx="8" class="sk" fill="#e4f0fb" stroke="#2778c4" stroke-width="2.5"/>
    <text x="330" y="126" text-anchor="middle" class="lbl" font-size="11" fill="#2778c4">partição de</text>
    <text x="330" y="142" text-anchor="middle" class="lbl" font-size="11" fill="#2778c4">gerência</text>

    <!-- hipervisor -->
    <rect x="80" y="168" width="290" height="50" rx="10" class="sk" fill="#eaf5ee" stroke="#2e7d52" stroke-width="3.5"/>
    <text x="225" y="199" text-anchor="middle" class="lbl" font-size="16" font-weight="bold" fill="#2e7d52">HIPERVISOR</text>

    <!-- hardware -->
    <rect x="80" y="230" width="290" height="50" rx="10" class="sk" fill="#eef1f7" stroke="#1d2057" stroke-width="3"/>
    <text x="225" y="261" text-anchor="middle" class="lbl" font-size="16" font-weight="bold" fill="#1d2057">HARDWARE</text>

    <text x="225" y="312" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#2e7d52">direto sobre o metal</text>
    <text x="225" y="334" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">Hyper-V · VMware ESXi · KVM</text>
    <text x="225" y="356" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">padrão em servidor</text>
  </g>

  <!-- ============ PILHA TIPO 2 (direita) ============ -->
  <g>
    <text x="675" y="84" text-anchor="middle" class="lbl" font-size="17" font-weight="bold" fill="#b1541b">TIPO 2 · hospedado</text>

    <!-- VMs -->
    <rect x="560" y="104" width="60" height="52" rx="8" class="sk" fill="#ffffff" stroke="#b1541b" stroke-width="2.5"/>
    <text x="590" y="136" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VM 1</text>
    <rect x="630" y="104" width="60" height="52" rx="8" class="sk" fill="#ffffff" stroke="#b1541b" stroke-width="2.5"/>
    <text x="660" y="136" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VM 2</text>

    <!-- programa de virtualizacao -->
    <rect x="530" y="168" width="290" height="50" rx="10" class="sk" fill="#fbeee6" stroke="#b1541b" stroke-width="3.5"/>
    <text x="675" y="199" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#b1541b">programa de virtualização</text>

    <!-- SO hospedeiro -->
    <rect x="530" y="230" width="290" height="50" rx="10" class="sk" fill="#e4f0fb" stroke="#2778c4" stroke-width="3"/>
    <text x="675" y="261" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2778c4">SO hospedeiro (Windows, Linux)</text>

    <!-- hardware -->
    <rect x="530" y="292" width="290" height="50" rx="10" class="sk" fill="#eef1f7" stroke="#1d2057" stroke-width="3"/>
    <text x="675" y="323" text-anchor="middle" class="lbl" font-size="16" font-weight="bold" fill="#1d2057">HARDWARE</text>

    <text x="675" y="374" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#b1541b">uma camada a mais no caminho</text>
    <text x="675" y="396" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">VirtualBox · VMware Workstation</text>
    <text x="675" y="418" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">prático para estudo</text>
  </g>

  <!-- RODAPE -->
  <text x="450" y="456" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">o tipo é decidido pela <tspan font-weight="bold">posição</tspan> do hipervisor, não por onde você clicou para instalar</text>
</svg>
