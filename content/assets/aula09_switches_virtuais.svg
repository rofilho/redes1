<!-- BRIEF: Aula 09 (Redes I). Os tres tipos de switch virtual do Hyper-V, pelo criterio da aula: quem alcanca quem. Externo: a VM entra na rede fisica (ponte). Interno: VMs e host, a rede fisica nao ve; sozinho nao da internet (NAT so se configurado a parte). Privado: so as VMs. Rodape: Default Switch = interno + NAT + DHCP. Redesenhada em 2026-11-10: a versao anterior tinha textos sobrepostos e dizia que o interno faz NAT, o que contradiz o topico 6.2. Fundo: cartao off-white fixo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Tres colunas. Switch externo: a rede fisica do laboratorio liga-se a placa de rede do host, que se liga ao vSwitch externo e a VM; a rede fisica ve a VM. Switch interno: o host liga-se ao vSwitch interno e a duas VMs; a rede fisica nao ve as VMs e, sozinho, ele nao da internet. Switch privado: o vSwitch privado liga so duas VMs; o host nao participa. Rodape: o Default Switch e um switch interno com NAT e DHCP ja configurados.">
  <defs>
    <style>
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
  </defs>
  <rect id="fundo-card" x="0" y="0" width="900" height="640" rx="18" fill="#fafaf8"/>

  <text x="450" y="38" text-anchor="middle" class="lbl" font-size="22" font-weight="bold" fill="#1d2057">Os três switches virtuais do Hyper-V: quem alcança quem</text>
  <path d="M200,48 q125,7 250,3 q125,-4 250,2" fill="none" stroke="#00aa9f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== COLUNA 1: EXTERNO ===== -->
  <rect x="15" y="64" width="280" height="474" rx="14" fill="none" stroke="#2778c4" stroke-width="2.5"/>
  <text x="155" y="96" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2778c4">1 · Externo</text>
  <text x="155" y="118" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">a VM entra na rede física</text>

  <rect x="45" y="138" width="220" height="54" rx="10" fill="#f0f3f8" stroke="#5a6478" stroke-width="2"/>
  <text x="155" y="161" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#1d2057">rede física do laboratório</text>
  <text x="155" y="181" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">roteador e DHCP do laboratório</text>
  <line x1="155" y1="192" x2="155" y2="222" stroke="#2778c4" stroke-width="2.5"/>

  <rect x="45" y="222" width="220" height="44" rx="10" fill="#f0f3f8" stroke="#5a6478" stroke-width="2"/>
  <text x="155" y="249" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">placa de rede física do host</text>
  <line x1="155" y1="266" x2="155" y2="296" stroke="#2778c4" stroke-width="2.5"/>

  <rect x="45" y="296" width="220" height="44" rx="10" fill="#2778c4" stroke="#2778c4" stroke-width="2"/>
  <text x="155" y="323" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#ffffff">vSwitch externo</text>
  <line x1="155" y1="340" x2="155" y2="370" stroke="#2778c4" stroke-width="2.5"/>

  <rect x="75" y="370" width="160" height="56" rx="10" fill="#e4f0fb" stroke="#2778c4" stroke-width="2.5"/>
  <text x="155" y="394" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">VM</text>
  <text x="155" y="414" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">IP do DHCP do laboratório</text>

  <text x="155" y="470" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2778c4">a rede física vê a VM</text>
  <text x="155" y="492" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">modo ponte (bridge)</text>
  <text x="155" y="512" text-anchor="middle" class="lbl" font-size="12" fill="#5a6478">para um servidor que a sala acessa</text>

  <!-- ===== COLUNA 2: INTERNO ===== -->
  <rect x="310" y="64" width="280" height="474" rx="14" fill="none" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="450" y="96" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2e7d52">2 · Interno</text>
  <text x="450" y="118" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">VMs e host, longe da rede física</text>

  <rect x="340" y="138" width="220" height="54" rx="10" fill="#fafaf8" stroke="#9aa0ad" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="450" y="161" text-anchor="middle" class="lbl" font-size="14" fill="#5a6478">internet</text>
  <text x="450" y="181" text-anchor="middle" class="lbl" font-size="12" fill="#5a6478">só se o host fizer NAT, à parte</text>
  <line x1="450" y1="192" x2="450" y2="222" stroke="#9aa0ad" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="340" y="222" width="220" height="44" rx="10" fill="#f0f3f8" stroke="#5a6478" stroke-width="2"/>
  <text x="450" y="249" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">host · adaptador vEthernet</text>
  <line x1="450" y1="266" x2="450" y2="296" stroke="#2e7d52" stroke-width="2.5"/>

  <rect x="340" y="296" width="220" height="44" rx="10" fill="#2e7d52" stroke="#2e7d52" stroke-width="2"/>
  <text x="450" y="323" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#ffffff">vSwitch interno</text>
  <line x1="400" y1="340" x2="395" y2="370" stroke="#2e7d52" stroke-width="2.5"/>
  <line x1="500" y1="340" x2="505" y2="370" stroke="#2e7d52" stroke-width="2.5"/>

  <rect x="335" y="370" width="110" height="56" rx="10" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="390" y="404" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">VM 1</text>
  <rect x="455" y="370" width="110" height="56" rx="10" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="510" y="404" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">VM 2</text>

  <text x="450" y="470" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2e7d52">a rede física não vê as VMs</text>
  <text x="450" y="492" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">sozinho, não dá internet</text>
  <text x="450" y="512" text-anchor="middle" class="lbl" font-size="12" fill="#5a6478">o host conversa com elas</text>

  <!-- ===== COLUNA 3: PRIVADO ===== -->
  <rect x="605" y="64" width="280" height="474" rx="14" fill="none" stroke="#b1541b" stroke-width="2.5"/>
  <text x="745" y="96" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#b1541b">3 · Privado</text>
  <text x="745" y="118" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">só as VMs, entre si</text>

  <rect x="635" y="138" width="220" height="54" rx="10" fill="#fafaf8" stroke="#9aa0ad" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="745" y="161" text-anchor="middle" class="lbl" font-size="14" fill="#5a6478">internet: não</text>
  <text x="745" y="181" text-anchor="middle" class="lbl" font-size="12" fill="#5a6478">não há caminho para fora</text>

  <rect x="635" y="222" width="220" height="44" rx="10" fill="#fafaf8" stroke="#9aa0ad" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="745" y="249" text-anchor="middle" class="lbl" font-size="14" fill="#5a6478">host: não participa</text>

  <rect x="635" y="296" width="220" height="44" rx="10" fill="#b1541b" stroke="#b1541b" stroke-width="2"/>
  <text x="745" y="323" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#ffffff">vSwitch privado</text>
  <line x1="695" y1="340" x2="690" y2="370" stroke="#b1541b" stroke-width="2.5"/>
  <line x1="795" y1="340" x2="800" y2="370" stroke="#b1541b" stroke-width="2.5"/>

  <rect x="630" y="370" width="110" height="56" rx="10" fill="#fbeee6" stroke="#b1541b" stroke-width="2.5"/>
  <text x="685" y="404" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">VM-A</text>
  <rect x="750" y="370" width="110" height="56" rx="10" fill="#fbeee6" stroke="#b1541b" stroke-width="2.5"/>
  <text x="805" y="404" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">VM-B</text>

  <text x="745" y="470" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#b1541b">só as VMs falam entre si</text>
  <text x="745" y="492" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">nem o host entra</text>
  <text x="745" y="512" text-anchor="middle" class="lbl" font-size="12" fill="#5a6478">rede de bastidor (backend)</text>

  <!-- ===== RODAPE: DEFAULT SWITCH ===== -->
  <rect x="95" y="560" width="710" height="58" rx="12" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2"/>
  <text x="450" y="584" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">Default Switch (Windows 10 e 11) = um interno que já vem com NAT e DHCP</text>
  <text x="450" y="606" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">a VM sai para a internet pela conexão do host, mas ninguém de fora a alcança</text>
</svg>
