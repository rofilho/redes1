<!-- BRIEF: FTP com duas portas. Cliente e servidor FTP; conexao de CONTROLE na porta 21 (comandos/login, sempre aberta) e conexao de DADOS na porta 20 (o arquivo, abre so na transferencia). Dois canais paralelos, cores distintas. Estetica hand-drawn/Excalidraw, halo off-white, fundo transparente, paleta Uniube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="FTP usa duas conexoes: controle na porta 21 para comandos e login, e dados na porta 20 para o arquivo em si">
  <defs>
    <style>
      .sk  { stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
    <marker id="f-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2778c4"/>
    </marker>
    <marker id="f-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b1541b"/>
    </marker>
  </defs>

  <!-- TITULO -->
  <text x="450" y="40" text-anchor="middle" class="lbl" font-size="24" font-weight="bold" fill="#1d2057">FTP: a conversa e o arquivo viajam separados</text>
  <path class="sk" d="M280,52 q85,7 170,3 q85,-4 170,2" stroke="#00aa9f" stroke-width="2.5"/>

  <!-- CLIENTE -->
  <g>
    <rect x="70" y="170" width="160" height="100" rx="12" class="sk" fill="#e4f0fb" stroke="#1d2057" stroke-width="3.5"/>
    <text x="150" y="212" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#1d2057">Cliente FTP</text>
    <text x="150" y="236" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">você</text>
  </g>

  <!-- SERVIDOR -->
  <g>
    <rect x="670" y="170" width="160" height="100" rx="12" class="sk" fill="#eaf5ee" stroke="#2e7d52" stroke-width="3.5"/>
    <text x="750" y="212" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2e7d52">Servidor FTP</text>
    <text x="750" y="236" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">guarda os arquivos</text>
  </g>

  <!-- CONTROLE (porta 21) em cima -->
  <g>
    <path class="sk" d="M230,196 q220,-30 440,0" stroke="#2778c4" stroke-width="3.5" marker-end="url(#f-blue)" marker-start="url(#f-blue)"/>
    <rect x="336" y="120" width="228" height="48" rx="10" fill="#e4f0fb" stroke="#2778c4" stroke-width="2.5"/>
    <text x="450" y="140" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2778c4">Controle &#183; porta 21</text>
    <text x="450" y="159" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">login, dir, comandos &#8212; sempre aberta</text>
  </g>

  <!-- DADOS (porta 20) embaixo -->
  <g>
    <path class="sk" d="M230,244 q220,30 440,0" stroke="#b1541b" stroke-width="3.5" marker-end="url(#f-org)"/>
    <rect x="336" y="300" width="228" height="48" rx="10" fill="#fbeee6" stroke="#b1541b" stroke-width="2.5"/>
    <text x="450" y="320" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#b1541b">Dados &#183; porta 20</text>
    <text x="450" y="339" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">o arquivo &#8212; abre só na transferência</text>
  </g>

  <!-- RODAPE -->
  <text x="450" y="400" text-anchor="middle" class="lbl" font-size="15" fill="#1d2057">A 21 <tspan font-weight="bold" fill="#2778c4">conversa</tspan>; a 20 <tspan font-weight="bold" fill="#b1541b">carrega</tspan>. Abrir só a 21 no firewall trava o download.</text>
</svg>
