<!-- BRIEF: Aula 10 (Redes I). Janela do Wireshark simplificada com o filtro dhcp: lista de pacotes de exemplo (Release, Discover, Offer, Request, ACK) e tres cartoes com os tres campos a ler (IP de destino do Discover, porta UDP de destino do Discover, Your (client) IP address do Offer). Todos os valores sao de exemplo. Fundo: cartao off-white fixo, vale nos temas claro e escuro. Paleta Uniube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Lista de pacotes do Wireshark com o filtro dhcp, em valores de exemplo: Release, Discover, Offer, Request e ACK. Abaixo, os três campos a ler: o IP de destino do Discover, a porta UDP de destino do Discover e o campo Your client IP address do Offer.">
  <defs>
    <style>
      .sk  { stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      .mono { font-family:'Courier New',Consolas,monospace; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
  </defs>
  <rect id="fundo-card" x="0" y="0" width="900" height="520" rx="18" fill="#fafaf8"/>

  <!-- TITULO -->
  <text x="450" y="36" text-anchor="middle" class="lbl" font-size="22" font-weight="bold" fill="#1d2057">O que o Wireshark mostra com o filtro dhcp</text>
  <text x="450" y="58" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">todos os valores desta figura são exemplos</text>

  <!-- BARRA DE FILTRO -->
  <g>
    <rect x="30" y="70" width="840" height="34" rx="8" class="sk" fill="#ffffff" stroke="#1d2057" stroke-width="2"/>
    <text x="44" y="92" class="lbl" font-size="14" fill="#1d2057">Filtro de exibição:</text>
    <rect x="190" y="76" width="140" height="22" rx="5" class="sk" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2"/>
    <text x="200" y="92" class="mono" font-size="15" font-weight="bold" fill="#1d2057">dhcp</text>
    <text x="350" y="92" class="lbl" font-size="14" fill="#2e7d52" font-weight="bold">digite e aperte Enter</text>
  </g>

  <!-- CABECALHO DA LISTA -->
  <g>
    <rect x="30" y="116" width="840" height="26" class="sk" fill="#e4eaf3" stroke="#1d2057" stroke-width="2"/>
    <text x="40" y="134" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">DORA</text>
    <text x="96" y="134" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">No.</text>
    <text x="146" y="134" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">Source</text>
    <text x="300" y="134" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">Destination</text>
    <text x="470" y="134" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">Info</text>
  </g>

  <!-- LINHAS -->
  <g class="mono" font-size="14" fill="#1d2057">
    <!-- 1 Release -->
    <rect x="30" y="142" width="840" height="30" class="sk" fill="#f1f1ee" stroke="#1d2057" stroke-width="1"/>
    <text x="96" y="162" fill="#1d2057">14</text>
    <text x="146" y="162" fill="#1d2057">192.168.10.25</text>
    <text x="300" y="162" fill="#1d2057">192.168.10.1</text>
    <text x="470" y="162" fill="#1d2057">DHCP Release  - Transaction ID 0x0c42d8b1</text>
    <!-- 2 Discover -->
    <rect x="30" y="172" width="840" height="30" class="sk" fill="#fbeee6" stroke="#1d2057" stroke-width="1"/>
    <rect x="30" y="172" width="8" height="30" fill="#b1541b"/>
    <text x="50" y="192" class="lbl" font-size="16" font-weight="bold" fill="#b1541b">D</text>
    <text x="96" y="192" fill="#1d2057">19</text>
    <text x="146" y="192" fill="#1d2057">0.0.0.0</text>
    <text x="300" y="192" fill="#1d2057">255.255.255.255</text>
    <text x="470" y="192" fill="#1d2057">DHCP Discover - Transaction ID 0x5e9a31c7</text>
    <!-- 3 Offer -->
    <rect x="30" y="202" width="840" height="30" class="sk" fill="#e3f5f3" stroke="#1d2057" stroke-width="1"/>
    <rect x="30" y="202" width="8" height="30" fill="#00aa9f"/>
    <text x="50" y="222" class="lbl" font-size="16" font-weight="bold" fill="#00aa9f">O</text>
    <text x="96" y="222" fill="#1d2057">20</text>
    <text x="146" y="222" fill="#1d2057">192.168.10.1</text>
    <text x="300" y="222" fill="#1d2057">255.255.255.255</text>
    <text x="470" y="222" fill="#1d2057">DHCP Offer    - Transaction ID 0x5e9a31c7</text>
    <!-- 4 Request -->
    <rect x="30" y="232" width="840" height="30" class="sk" fill="#fbeee6" stroke="#1d2057" stroke-width="1"/>
    <rect x="30" y="232" width="8" height="30" fill="#b1541b"/>
    <text x="50" y="252" class="lbl" font-size="16" font-weight="bold" fill="#b1541b">R</text>
    <text x="96" y="252" fill="#1d2057">23</text>
    <text x="146" y="252" fill="#1d2057">0.0.0.0</text>
    <text x="300" y="252" fill="#1d2057">255.255.255.255</text>
    <text x="470" y="252" fill="#1d2057">DHCP Request  - Transaction ID 0x5e9a31c7</text>
    <!-- 5 ACK -->
    <rect x="30" y="262" width="840" height="30" class="sk" fill="#e3f5f3" stroke="#1d2057" stroke-width="1"/>
    <rect x="30" y="262" width="8" height="30" fill="#00aa9f"/>
    <text x="50" y="282" class="lbl" font-size="16" font-weight="bold" fill="#00aa9f">A</text>
    <text x="96" y="282" fill="#1d2057">24</text>
    <text x="146" y="282" fill="#1d2057">192.168.10.1</text>
    <text x="300" y="282" fill="#1d2057">255.255.255.255</text>
    <text x="470" y="282" fill="#1d2057">DHCP ACK      - Transaction ID 0x5e9a31c7</text>
  </g>

  <!-- MARCADORES 1 2 3 NAS LINHAS -->
  <g>
    <circle cx="835" cy="187" r="10" fill="#7a4fb0"/>
    <text x="835" y="192" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <circle cx="857" cy="187" r="10" fill="#7a4fb0"/>
    <text x="857" y="192" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="835" cy="217" r="10" fill="#7a4fb0"/>
    <text x="835" y="222" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  </g>

  <!-- NOTA SOBRE A LISTA -->
  <text x="30" y="316" class="lbl" font-size="13" fill="#1d2057">Release: aparece se o ipconfig /release avisar o servidor · a mesma Transaction ID liga as quatro do DORA</text>

  <!-- TRES CARTOES -->
  <text x="30" y="346" class="lbl" font-size="17" font-weight="bold" fill="#1d2057">Os três campos que você vai ler (clique no pacote e abra a camada)</text>
  <g>
    <rect x="30" y="360" width="256" height="132" rx="12" class="sk" fill="#f1ebf8" stroke="#7a4fb0" stroke-width="2.5"/>
    <circle cx="54" cy="384" r="12" fill="#7a4fb0"/>
    <text x="54" y="389" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="74" y="389" class="lbl" font-size="15" font-weight="bold" fill="#7a4fb0">IP de destino do Discover</text>
    <text x="44" y="418" class="lbl" font-size="12" fill="#1d2057">Camada: Internet Protocol Version 4</text>
    <text x="44" y="438" class="lbl" font-size="12" fill="#1d2057">Campo: Destination</text>
    <text x="44" y="468" class="lbl" font-size="14" font-weight="bold" fill="#1d2057">esperado: 255.255.255.255</text>
  </g>
  <g>
    <rect x="298" y="360" width="256" height="132" rx="12" class="sk" fill="#f1ebf8" stroke="#7a4fb0" stroke-width="2.5"/>
    <circle cx="322" cy="384" r="12" fill="#7a4fb0"/>
    <text x="322" y="389" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="342" y="389" class="lbl" font-size="15" font-weight="bold" fill="#7a4fb0">Porta UDP do Discover</text>
    <text x="312" y="418" class="lbl" font-size="12" fill="#1d2057">Camada: User Datagram Protocol</text>
    <text x="312" y="438" class="lbl" font-size="12" fill="#1d2057">Campo: Destination Port</text>
    <text x="312" y="468" class="lbl" font-size="14" font-weight="bold" fill="#1d2057">esperado: 67</text>
  </g>
  <g>
    <rect x="566" y="360" width="304" height="132" rx="12" class="sk" fill="#f1ebf8" stroke="#7a4fb0" stroke-width="2.5"/>
    <circle cx="590" cy="384" r="12" fill="#7a4fb0"/>
    <text x="590" y="389" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="610" y="389" class="lbl" font-size="15" font-weight="bold" fill="#7a4fb0">Endereço oferecido no Offer</text>
    <text x="580" y="418" class="lbl" font-size="12" fill="#1d2057">Camada: Dynamic Host Configuration Protocol</text>
    <text x="580" y="438" class="lbl" font-size="12" fill="#1d2057">Campo: Your (client) IP address</text>
    <text x="580" y="468" class="lbl" font-size="14" font-weight="bold" fill="#1d2057">exemplo: 192.168.10.25</text>
  </g>
</svg>